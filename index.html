<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>쉬운 국어 학습지 (120차시)</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header id="bar" aria-label="도구 모음">
  <button id="bHome" class="tb" title="처음 화면">🏠 처음</button>
  <div class="grp" role="group" aria-label="글자 크기">
    <button id="bFsDown" class="tb" title="글자 작게" data-repeat>가 −</button>
    <span id="fsLabel" class="lbl">글자 100%</span>
    <button id="bFsUp" class="tb" title="글자 크게" data-repeat>가 ＋</button>
  </div>
  <div class="grp" role="group" aria-label="화면 확대">
    <button id="bZoomDown" class="tb" title="화면 축소" data-repeat>🔍 −</button>
    <span id="zoomLabel" class="lbl">화면 100%</span>
    <button id="bZoomUp" class="tb" title="화면 확대" data-repeat>🔍 ＋</button>
  </div>
  <button id="bSpeak" class="tb" title="소리로 듣기">🔊 듣기</button>
  <button id="bSet" class="tb" title="설정">⚙️ 설정</button>
</header>

<main id="stage"></main>

<div id="pad" aria-label="화면 이동">
  <button id="bUp" class="tb" title="위로" data-repeat>▲</button>
  <button id="bDown" class="tb" title="아래로" data-repeat>▼</button>
</div>

<div id="ring" aria-hidden="true"><i></i></div>
<div id="modal" hidden></div>
<div id="print"></div>

<script src="vendor/canvas-confetti/confetti.browser.min.js"></script>
<script src="js/data1.js"></script>
<script src="js/data2.js"></script>
<script src="js/data3.js"></script>
<script src="js/data4.js"></script>
<script src="js/data5.js"></script>
<script src="js/data6.js"></script>
<script src="js/more1.js"></script>
<script src="js/more2.js"></script>
<script src="js/more3.js"></script>
<script src="js/more4.js"></script>
<script src="js/more5.js"></script>
<script src="js/more6.js"></script>
<script src="js/app.js"></script>
</body>
</html>
